databases:
  - name: grit-db
    databaseName: grit
    user: grit
    plan: free
services:
  - type: web
    name: grit-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: grit-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
  - type: web
    name: grit-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: grit-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
